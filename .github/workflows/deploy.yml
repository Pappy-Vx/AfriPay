name: AfripPay CI/CD
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build docker image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest .

   # TEST DATABASE CONNECTIVITY BEFORE DEPLOYING
    - name: Test Database Connectivity
      run: |
        echo "Extracting DB parameters from connection string..."

        CONNECTION_STRING="${{ secrets.ConnectionStrings__DefaultConnection }}"

        DB_SERVER=$(echo $CONNECTION_STRING | sed -n 's/.*Server=tcp:\([^,]*\).*/\1/p')
        DB_USER=$(echo $CONNECTION_STRING | sed -n 's/.*User ID=\([^;]*\).*/\1/p')
        DB_PASSWORD=$(echo $CONNECTION_STRING | sed -n 's/.*Password=\([^;]*\).*/\1/p')

        echo "Testing database connectivity to $DB_SERVER ..."

        docker run --rm mcr.microsoft.com/mssql-tools \
          /opt/mssql-tools/bin/sqlcmd \
          -S "$DB_SERVER,1433" \
          -U "$DB_USER" \
          -P "$DB_PASSWORD" \
          -Q "SELECT 1"

        echo "Database connection successful."

    - name: Login to Azure Container Registry
      run: |
        echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Push Image to ACR
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name ${{ secrets.CONTAINERAPPS_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest
