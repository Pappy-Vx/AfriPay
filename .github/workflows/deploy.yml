name: AfripPay CI/CD
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build docker image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest .

   
    - name: Login to Azure Container Registry
      run: |
        echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Push Image to ACR
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name ${{ secrets.CONTAINERAPPS_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest

# Post-deploy: Test DB connectivity from inside the container
    - name: Test Database Connectivity in Container
      run: |
        echo "Checking DB connection inside the deployed container..."
        DB_CONNECTION_STRING="${{ secrets.ConnectionStrings__DefaultConnection }}"

        # Run a temporary command inside the Azure Container App
        az containerapp exec \
          --name ${{ secrets.CONTAINERAPPS_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --container afripay-api \
          --command "dotnet ef database update --connection \"$DB_CONNECTION_STRING\" --verbose" || exit 1

        echo "✅ Database connection successful."

