name: AfripPay CI/CD
on:
  push:
    branches:
      - dev
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Build and Push image to ACR
      uses: azure/cli@v2
      with:
        inlineScript: |
          az cr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image afripay-api:latest \
            .
    - name: Deploy to Azure Container Apps
      uses: azure/cli@v2
      with:
        inlineScript: |
          az containerapp update \
            --name ${{ secrets.CONTAINERAPPS_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/afripay-api:latest
    
    
