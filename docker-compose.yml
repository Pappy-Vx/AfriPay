services:
  # MS SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: afripay-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - afripay-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # AfriPay API
  afripay-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afripay-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=sqlserver,1433;Initial Catalog=AfriPay;User ID=sa;Password=YourStrong@Passw0rd;Encrypt=False;Trust Server Certificate=True;
      - JwtSettings__SecretKey=YourSuperSecretKeyThatIsAtLeast32CharactersLongForHS256!
      - JwtSettings__Issuer=AfriPay
      - JwtSettings__Audience=AfriPayUsers
      - JwtSettings__ExpirationMinutes=60
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - afripay-network
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local

networks:
  afripay-network:
    driver: bridge
